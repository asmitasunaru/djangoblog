{% extends "blog/base.html" %}

{% block title %}Edit Project{% endblock %}

{% block content %}

<style>

    .form-box {
        max-width: 800px;
        margin: 50px auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .form-box h1 {
        color: #667eea;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-top: 20px;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
    }

    textarea {
        min-height: 200px;
        resize: vertical;
    }

    button {
        margin-top: 25px;
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        background: #667eea;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

</style>


<div class="form-box">

    <h1>Edit Project</h1>


    <form method="POST">

        {% csrf_token %}


        <label>
            Project Title
        </label>

        <input
            type="text"
            name="title"
            value="{{ post.title }}"
            required
        >


        <label>
            Project Description
        </label>

        <textarea
            name="content"
            required
        >{{ post.content }}</textarea>


        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
