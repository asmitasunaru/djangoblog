<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Django Blog{% endblock %}</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #333;
        }


        /* ===== Header ===== */

        header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 22px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }


        /* ===== Logo ===== */

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }


        /* ===== Navigation ===== */

        nav {
            display: flex;
            gap: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 16px;
            transition: 0.3s;
        }

        nav a:hover {
            background: white;
            color: #667eea;
        }


        /* ===== Main ===== */

        main {
            min-height: 80vh;
            padding: 20px;
        }


        /* ===== Footer ===== */

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 30px;
            background: #222;
            color: white;
        }


        /* ===== Mobile ===== */

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

        }

    </style>

</head>


<body>


    <!-- Header -->

    <header>

        <a href="/" class="logo">
            Django Blog
        </a>


        <nav>

            <a href="/">
                Home
            </a>

            <a href="/about/">
                About
            </a>

            <a href="/posts/">
                Posts
            </a>

        </nav>

    </header>


    <!-- Main Content -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- Footer -->

    <footer>

        <p>© 2026 Django Blog. All Rights Reserved.</p>

    </footer>


</body>

</html>
