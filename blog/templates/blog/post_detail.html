{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}

<style>

    .detail {
        max-width: 900px;
        margin: 50px auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .detail h1 {
        color: #667eea;
        margin-bottom: 10px;
    }

    .date {
        color: #999;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .cover {
        width: 100%;
        max-height: 450px;
        object-fit: cover;
        border-radius: 15px;
        margin-bottom: 30px;
        display: block;
    }

    .content {
        color: #555;
        line-height: 1.9;
        font-size: 17px;
        margin-bottom: 30px;
    }

    .button {
        display: inline-block;
        padding: 11px 22px;
        margin-right: 10px;
        border-radius: 25px;
        text-decoration: none;
        color: white;
    }

    .edit {
        background: #667eea;
    }

    .delete {
        background: #e74c3c;
    }

    .back {
        background: #777;
    }

</style>


<div class="detail">

    <h1>
        {{ post.title }}
    </h1>

    <div class="date">
        {{ post.created_at|date:"M d, Y" }}
    </div>


    <!-- Photo -->

    {% if post.cover_image %}
        <img
            src="{{ post.cover_image.url }}"
            alt="{{ post.title }}"
            class="cover"
        >
    {% endif %}


    <div class="content">

        {{ post.content|linebreaks }}

    </div>


    <!-- Edit -->

    <a
        href="{% url 'post_edit' post.pk %}"
        class="button edit"
    >
        Edit
    </a>


    <!-- Delete -->

    <a
        href="{% url 'post_delete' post.pk %}"
        class="button delete"
    >
        Delete
    </a>


    <!-- Back -->

    <a
        href="{% url 'post_list' %}"
        class="button back"
    >
        Back
    </a>

</div>

{% endblock %}
