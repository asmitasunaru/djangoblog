<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 Forbidden</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .box {
            background: white;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            font-size: 80px;
            color: #667eea;
        }

        p {
            color: #555;
        }

        a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>403</h1>
        <h2>Forbidden</h2>
        <p>You do not have permission to access this page.</p>
        <a href="/">Go to Home</a>
    </div>
</body>
</html>
